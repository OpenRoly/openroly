[package]
name = "openroly-broker"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
# Signature verification for the Detector Registry. Only verify_strict is used (keys are generated in the cloud)
ed25519-dalek = "2.2.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
http = "1.5.0"
# `kill(-pgid, sig)` = signal a whole process group. **Not a new crate** —
# tokio already pulls it in, so the lock file gains no crates (`nix` would be a new one, so it isn't used).
# We no longer fork an external `kill` command: implementations disagree on negative pids, and
# waiting on `.status()` blocks a tokio worker thread.
libc = "0.2.189"
# Filesystem watch. On macOS only the FSEvents backend is used
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync", "io-util"] }
# **TLS uses rustls**, not native-tls: the distributed binaries target several OSes, and not depending
# on each OS's TLS stack breaks less. Root certificates come from the OS store (`*-native-roots`),
# so it also works behind corporate TLS interception.
# Without it the broker **never connects** to hosted (https / wss) —
# it reconnects forever with `connect failed: URL error: TLS support not compiled in`,
# and runtimes are never registered automatically (hit in production on 2026-09-03)
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "rustls-tls-native-roots"] }
# Registry download. Needs TLS for the same reason (a signature can't be verified before the fetch)
ureq = { version = "2.12.1", default-features = false, features = ["tls", "native-certs"] }
