# CI for the public repository (OpenRoly/openroly): every push and pull request runs the same checks
# CONTRIBUTING.md asks contributors to run locally.
#
# The canonical private repository runs its own ci.yml (it needs the account server and Postgres),
# so every job here is skipped outside OpenRoly/openroly — the same file lives in both trees without
# running twice. No secrets are used, so pull requests from forks get the same result.
#
# Action versions match release.yml (checked against the GitHub API on 2026-09-12).
name: public-ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"] # tags are release.yml's job
  pull_request:
  # release.yml calls this on a tag (PBI-0647). A tag runs none of these checks on its own
  # (`tags-ignore` above), so without this the publishing job has nothing to wait for.
  # Called, not copied — the job list stays in one file.
  workflow_call:

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  bun:
    if: github.repository == 'OpenRoly/openroly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # bun.lock here matches this repository's workspaces exactly, so frozen must pass
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Personal Agent Account Protocol v0.1 (specs/paap): the reference validator and both example
      # implementations against every fixture. A step of its own so a protocol failure reads as one line.
      # examples/miniroly-py needs Python 3, which ubuntu-latest ships.
      - name: PAAP conformance
        run: |
          python3 --version
          bun test packages/core/test/protocol.test.ts packages/core/test/miniroly.test.ts packages/core/test/miniroly-py.test.ts --timeout 30000
      # PBI-0597: the MCP bundle is a build artifact and is not tracked. Build it here so a missing
      # bundle reads as one line instead of surfacing inside the plugin tests (they can rebuild it
      # themselves, but the explicit step keeps the failure readable).
      - run: bun run plugin:build
      - run: bun test apps/cli packages --timeout 30000

  broker:
    if: github.repository == 'OpenRoly/openroly'
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the Seatbelt sandbox tests; Linux runs everything that isn't macOS-only
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # the broker uses edition 2024
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: broker
      - run: cargo test --manifest-path broker/Cargo.toml
