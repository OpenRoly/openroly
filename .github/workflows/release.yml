# tag を打つと単体実行ファイル + broker(Rust)binary を作って Release に添付する(PBI-0137・PBI-0154)。
#
# `openroly install` / `openroly login` と plugin の launcher はここで公開された asset を取りに来る
# (`https://github.com/<owner>/<repo>/releases/download/v<version>/openroly-mcp-<target>`)。
# **公開 repo(openroly/openroly)側で走った Release だけが token 無しで取れる** ——
# 正本 repo(private)で走らせた場合、asset は private になり取得側は 404 になる。
# action の版は 2026-09-01 に GitHub API で実測した最新 major:
#   actions/checkout v7.0.1 / oven-sh/setup-bun v2.2.0 / softprops/action-gh-release v3.0.3 /
#   actions/upload-artifact v7.0.1 / actions/download-artifact v8.0.1
# `macos-14` は 2026-07-06 から非推奨(2026-11-02 に廃止)なので broker の darwin build は
# `macos-latest` を使う(実測: 2026-09-01 時点で macOS 26 相当)。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Release を作って asset を添付するのに要る(それ以外は要らない)

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # cross target の runtime は bun が自分で download するので、3 target とも 1 job で作れる
      - name: build binaries
        run: ./scripts/build-binaries.sh --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: bun-binaries
          path: dist/*
          retention-days: 1

  # broker(Rust)は bun compile と違って自前でクロスコンパイルしない(notify クレートが
  # macOS backend を要る)。darwin 2 target(arm64/x64)は macOS runner 1 本で作る ——
  # Apple 純正ツールチェーンは同一 host から両 darwin arch を linker 追加無しでビルドできる
  # (2026-09-01 実測: このリポジトリの x64 mac で aarch64-apple-darwin への `cargo check` が
  # 素で通った。逆向きの arm64 → x86_64-apple-darwin も同じ toolchain で成立する)
  broker-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-apple-darwin

      # OPENROLY_REGISTRY_PUBLIC_KEY は compile-time pin(broker/src/registry.rs)。本番の署名鍵は
      # dev と同一(shibubu-manager/secrets/REGISTRY.md 実測)なので、broker/registry.pub の
      # 値がそのまま本番向けの正しい public key ——secret ではないのでそのまま焼く
      - name: build broker (darwin-arm64 / darwin-x64)
        working-directory: broker
        run: |
          key="$(cat registry.pub)"
          OPENROLY_REGISTRY_PUBLIC_KEY="$key" cargo build --release
          OPENROLY_REGISTRY_PUBLIC_KEY="$key" cargo build --release --target x86_64-apple-darwin
          mkdir -p ../dist
          cp target/release/openroly-broker ../dist/openroly-broker-darwin-arm64
          cp target/x86_64-apple-darwin/release/openroly-broker ../dist/openroly-broker-darwin-x64

      - uses: actions/upload-artifact@v7
        with:
          name: broker-darwin
          path: dist/*
          retention-days: 1

  broker-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build broker (linux-x64)
        working-directory: broker
        run: |
          key="$(cat registry.pub)"
          OPENROLY_REGISTRY_PUBLIC_KEY="$key" cargo build --release
          mkdir -p ../dist
          cp target/release/openroly-broker ../dist/openroly-broker-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: broker-linux
          path: dist/*
          retention-days: 1

  release:
    needs: [binaries, broker-darwin, broker-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 取得側(ensureBinary / launcher)は SHA256SUMS を**必ず**照合する。
      # ここで作らないと、どちらも「照合表が無い」として取得を諦める(壊れた binary は流れない)
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum openroly-mcp-* openroly-darwin-* openroly-linux-* openroly-broker-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/openroly-mcp-darwin-arm64
            dist/openroly-mcp-darwin-x64
            dist/openroly-mcp-linux-x64
            dist/openroly-darwin-arm64
            dist/openroly-darwin-x64
            dist/openroly-linux-x64
            dist/openroly-broker-darwin-arm64
            dist/openroly-broker-darwin-x64
            dist/openroly-broker-linux-x64
            dist/SHA256SUMS
