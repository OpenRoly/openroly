# Pushing a tag builds the standalone binaries and the broker (Rust) binaries and attaches them to a Release.
#
# `openroly install` / `openroly login` and the plugin launcher download the assets published here
# (`https://github.com/<owner>/<repo>/releases/download/v<version>/openroly-mcp-<target>`).
# **Only Releases built in the public repo (openroly/openroly) can be downloaded without a token** —
# if this runs in the private source repo, the assets are private and downloads return 404.
# Action versions are the latest majors checked against the GitHub API on 2026-09-01:
#   actions/checkout v7.0.1 / oven-sh/setup-bun v2.2.0 / softprops/action-gh-release v3.0.3 /
#   actions/upload-artifact v7.0.1 / actions/download-artifact v8.0.1
# `macos-14` is deprecated from 2026-07-06 (removed 2026-11-02), so the darwin broker build uses
# `macos-latest` (macOS 26 as of 2026-09-01).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the Release and attach assets (nothing else)

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # `bun.lock` is generated in the source repo, so it lists the `apps/server` / `apps/web` workspaces.
      # Those two don't exist in the public repo, so **a frozen install can never pass here**
      # (checked 2026-09-07: 4/4 public clones failed with `lockfile had changes`; a fresh clone of the
      # source repo passed). If this step failed, the binaries job would fail and none of the assets
      # that `openroly install` / the launcher download would be published.
      - run: bun install --frozen-lockfile || bun install

      # bun downloads the cross-target runtimes itself, so one job builds all 3 targets
      - name: build binaries
        run: ./scripts/build-binaries.sh --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: bun-binaries
          path: dist/*
          retention-days: 1

  # Unlike bun compile, the broker (Rust) is not cross-compiled here (the notify crate needs the
  # macOS backend). Both darwin targets (arm64/x64) are built on one macOS runner — Apple's
  # toolchain builds both darwin archs from a single host without an extra linker
  # (checked 2026-09-01: `cargo check` for aarch64-apple-darwin passed as-is on an x64 Mac;
  # the reverse, arm64 → x86_64-apple-darwin, works with the same toolchain).
  broker-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add x86_64-apple-darwin

      # OPENROLY_REGISTRY_PUBLIC_KEY is pinned at compile time (broker/src/registry.rs). **Production
      # uses broker/registry.prod.pub** — a registry signed with the dev key (registry.pub) is rejected
      # by the distributed binary. It is a public key, not a secret, so it is baked in as-is. If the
      # file is missing or malformed, `set -e` fails the job
      # (cargo test's prod_pinned_key_parses_and_differs_from_dev catches it earlier in CI).
      - name: build broker (darwin-arm64 / darwin-x64)
        working-directory: broker
        run: |
          key="$(cat registry.prod.pub)"
          OPENROLY_REGISTRY_PUBLIC_KEY="$key" cargo build --release
          OPENROLY_REGISTRY_PUBLIC_KEY="$key" cargo build --release --target x86_64-apple-darwin
          mkdir -p ../dist
          cp target/release/openroly-broker ../dist/openroly-broker-darwin-arm64
          cp target/x86_64-apple-darwin/release/openroly-broker ../dist/openroly-broker-darwin-x64

      - uses: actions/upload-artifact@v7
        with:
          name: broker-darwin
          path: dist/*
          retention-days: 1

  broker-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build broker (linux-x64)
        working-directory: broker
        run: |
          key="$(cat registry.prod.pub)"
          OPENROLY_REGISTRY_PUBLIC_KEY="$key" cargo build --release
          mkdir -p ../dist
          cp target/release/openroly-broker ../dist/openroly-broker-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: broker-linux
          path: dist/*
          retention-days: 1

  release:
    needs: [binaries, broker-darwin, broker-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The downloaders (ensureBinary / the launcher) **always** verify SHA256SUMS.
      # Without it, both give up for lack of a checksum list (so a broken binary is never installed)
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum openroly-mcp-* openroly-darwin-* openroly-linux-* openroly-broker-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/openroly-mcp-darwin-arm64
            dist/openroly-mcp-darwin-x64
            dist/openroly-mcp-linux-x64
            dist/openroly-darwin-arm64
            dist/openroly-darwin-x64
            dist/openroly-linux-x64
            dist/openroly-broker-darwin-arm64
            dist/openroly-broker-darwin-x64
            dist/openroly-broker-linux-x64
            dist/SHA256SUMS
