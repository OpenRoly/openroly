name: Bug report
description: Something in the CLI, an adapter, the MCP server, the broker, or the encryption envelope doesn't behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is Public Alpha — breaking changes are expected, but behavior that differs from
        the README, `specs/*.md`, or the code comments is still worth reporting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/cli
        - broker (background service, sandbox, egress proxy)
        - packages/core
        - packages/crypto-envelope
        - packages/adapter
        - packages/mcp
        - packages/mcp-mask
        - adapters/official/claude
        - adapters/official/codex
        - adapters/official/api
        - specs/ (documentation mismatch)
        - README / install steps
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro — commands run, `openroly status` / `openroly doctor` output, relevant `bun test` output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: "The release tag you downloaded (e.g. v0.2.4) or `git rev-parse HEAD`, plus macOS / Linux and CPU"
    validations:
      required: false
