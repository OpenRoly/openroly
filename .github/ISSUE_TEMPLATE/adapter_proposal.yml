name: Runtime adapter proposal
description: Propose or start work on an ExtensionAdapter implementation for a runtime that isn't officially supported yet (Hermes, OpenClaw, or another).
labels: ["adapter"]
body:
  - type: markdown
    attributes:
      value: |
        OpenRoly's value is runtime neutrality, and that only means something if many runtimes
        implement the contract. See `specs/extension-adapter-contract.md` and the reference
        implementations in `adapters/official/{claude,codex,gemini,api}` before starting.
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Which runtime/CLI/agent framework this adapter is for.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: What this runtime can do
      description: |
        Does it have an MCP config you can write, a CLI you can shell out to, a skills directory,
        a headless mode the broker could launch, and hooks that can stop a tool call?
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: Contract gaps or open questions
      description: Anything in `specs/extension-adapter-contract.md` that doesn't map cleanly onto this runtime.
    validations:
      required: false
  - type: checkboxes
    id: status
    attributes:
      label: Status
      options:
        - label: I'm proposing this and looking for feedback before writing code
        - label: I have a draft implementation ready for review
